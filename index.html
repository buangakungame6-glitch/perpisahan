<!DOCTYPE html>
<html lang="id">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#F4ECDD">
<title>Sampai Berjumpa Lagi Santis DIKOMINFO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#2A1A0F;--ink-2:#4E3A28;--ink-3:#7C6650;--ink-soft:#A89478;--paper:#F4ECDD;--paper-card:#FFFFFF;--champagne:#C9A979;--terracotta:#B86E4F;--rose:#C99A92;--sage:#8A9C7E;--gold-line:#B89868;--accent:#B86E4F;--tape:rgba(184,152,104,0.55);--shadow-sm:rgba(80,50,20,0.06);--shadow-md:rgba(80,50,20,0.12);--shadow-lg:rgba(80,50,20,0.18);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter','Helvetica Neue',sans-serif;--script:'Caveat',cursive}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);overflow:hidden;position:relative;font-weight:400;line-height:1.6;letter-spacing:-0.005em;color-scheme:light;transition:background 1.6s ease;height:100vh;height:100svh;background-size:200% 200%;animation:bgBreathe 25s ease-in-out infinite}
@keyframes bgBreathe{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.55 0 0 0 0 0.42 0 0 0 0 0.28 0 0 0 0.08 0'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)'/%3E%3C/svg%3E");opacity:0.45;mix-blend-mode:multiply}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,0.12) 100%)}
body[data-theme="default"],body[data-theme="dino"]{background:radial-gradient(ellipse at 75% 15%,rgba(201,169,121,0.20) 0%,transparent 50%),radial-gradient(ellipse at 20% 80%,rgba(184,110,79,0.14) 0%,transparent 55%),linear-gradient(180deg,#F4ECDD 0%,#EBE0CB 50%,#E2D3B8 100%)}
body[data-theme="pink"]{--ink:#4A2A3A;--ink-2:#6E4555;--ink-3:#9A7080;--ink-soft:#B890A0;--accent:#D87890;--tape:rgba(216,138,160,0.6);background:radial-gradient(ellipse at 80% 10%,rgba(255,225,235,0.85) 0%,transparent 50%),radial-gradient(ellipse at 20% 80%,rgba(255,200,220,0.5) 0%,transparent 55%),linear-gradient(180deg,#FBE4EC 0%,#F8D0DD 40%,#F5E0E8 75%,#F5E8DC 100%)}
body[data-theme="lavender"]{--ink:#3A2A4A;--ink-2:#5A4A6A;--ink-3:#8A7A9A;--ink-soft:#AA9ABA;--accent:#9878B8;--tape:rgba(152,120,184,0.6);background:radial-gradient(ellipse at 80% 10%,rgba(230,220,250,0.85) 0%,transparent 50%),radial-gradient(ellipse at 20% 80%,rgba(210,190,250,0.4) 0%,transparent 55%),linear-gradient(180deg,#F0E8FA 0%,#E8E0F5 40%,#F0EAF8 75%,#F5F0FA 100%)}
body[data-theme="mint"]{--ink:#2A4A3A;--ink-2:#4A6A5A;--ink-3:#7A9A8A;--ink-soft:#9ABAAA;--accent:#5A9A7A;--tape:rgba(90,154,122,0.6);background:radial-gradient(ellipse at 80% 10%,rgba(220,250,230,0.85) 0%,transparent 50%),radial-gradient(ellipse at 20% 80%,rgba(190,235,210,0.4) 0%,transparent 55%),linear-gradient(180deg,#E8FAF0 0%,#D8F0E5 40%,#E8F8F0 75%,#F0FAF5 100%)}
body[data-theme="peach"]{--ink:#4A3A2A;--ink-2:#6A5A4A;--ink-3:#9A8A7A;--ink-soft:#BA9A8A;--accent:#D89060;--tape:rgba(216,144,96,0.6);background:radial-gradient(ellipse at 80% 10%,rgba(255,235,210,0.85) 0%,transparent 50%),radial-gradient(ellipse at 20% 80%,rgba(255,210,180,0.4) 0%,transparent 55%),linear-gradient(180deg,#FFF0E8 0%,#FFE5D8 40%,#FFF5F0 75%,#FFF8F5 100%)}
body[data-theme="cosmos"]{--ink:#F0E8FF;--ink-2:#C5C8E0;--ink-3:#9098C0;--ink-soft:#7080A8;--accent:#E8C078;--paper-card:rgba(255,255,255,0.94);--tape:rgba(200,200,240,0.5);background:radial-gradient(ellipse at 75% 25%,rgba(120,80,180,0.35) 0%,transparent 45%),radial-gradient(ellipse at 25% 75%,rgba(80,120,200,0.28) 0%,transparent 45%),linear-gradient(180deg,#0A0E2E 0%,#1A1B4E 35%,#262860 65%,#0E1030 100%)}
body[data-theme="lantern"]{--ink:#FFE8C8;--ink-2:#D0B898;--ink-3:#A08868;--ink-soft:#806848;--accent:#FFB860;--paper-card:rgba(255,250,235,0.95);--tape:rgba(255,180,100,0.5);background:radial-gradient(ellipse at 80% 15%,rgba(255,200,120,0.22) 0%,transparent 40%),radial-gradient(ellipse at 20% 50%,rgba(180,80,40,0.18) 0%,transparent 45%),linear-gradient(180deg,#1A1230 0%,#2A1E40 30%,#1A1230 60%,#0A0820 100%)}

.cursor-glow{position:fixed;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.08) 0%,transparent 60%);pointer-events:none;z-index:20;transform:translate(-50%,-50%);will-change:transform;transition:opacity 0.3s ease;mix-blend-mode:screen}
.light-ray{position:absolute;width:4px;height:100%;background:linear-gradient(180deg,rgba(255,255,255,0.15) 0%,transparent 80%);transform-origin:top center;animation:raySway 10s ease-in-out infinite;will-change:transform}
@keyframes raySway{0%,100%{transform:rotate(-8deg) scaleY(0.8);opacity:0.3}50%{transform:rotate(8deg) scaleY(1);opacity:0.5}}

.music-toggle{position:fixed;top:1.25rem;right:1.25rem;width:46px;height:46px;background:rgba(255,255,255,0.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.7);border-radius:50%;cursor:pointer;z-index:100;display:flex;align-items:center;justify-content:center;transition:all 0.4s ease;color:var(--ink);box-shadow:0 4px 14px var(--shadow-md)}
.music-toggle:hover{background:rgba(255,255,255,0.85);transform:scale(1.06)}
.music-toggle.not-started::before{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent);opacity:0.6;animation:musicHint 2s ease-in-out infinite}
@keyframes musicHint{0%,100%{transform:scale(1);opacity:0.6}50%{transform:scale(1.3);opacity:0}}
.music-toggle svg{width:20px;height:20px}.music-toggle .icon-playing{display:none}.music-toggle.playing .icon-muted{display:none}.music-toggle.playing .icon-playing{display:block}
.music-toggle.playing .bars{animation:bars 0.8s ease-in-out infinite alternate;transform-origin:bottom}
.music-toggle.playing .bar1{animation-delay:0s}.music-toggle.playing .bar2{animation-delay:0.2s}.music-toggle.playing .bar3{animation-delay:0.4s}
@keyframes bars{0%{transform:scaleY(0.4)}100%{transform:scaleY(1)}}
.music-label{position:fixed;top:1.4rem;right:5.5rem;font-family:var(--script);font-size:0.95rem;color:var(--ink-2);background:rgba(255,255,255,0.55);backdrop-filter:blur(10px);padding:0.4rem 0.9rem;border-radius:999px;border:1px solid rgba(255,255,255,0.6);box-shadow:0 4px 14px var(--shadow-md);z-index:100;opacity:0;pointer-events:none;transition:opacity 0.6s ease;white-space:nowrap}
.music-label.show{opacity:1}.music-label.hide{opacity:0}

.theme-transition{position:fixed;inset:0;z-index:150;background:linear-gradient(180deg,#F4ECDD 0%,#EBE0CB 50%,#E2D3B8 100%);opacity:0;pointer-events:none;transition:opacity 0.9s cubic-bezier(0.4,0,0.2,1);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem}
.theme-transition.active{opacity:1;pointer-events:all}
.theme-transition-text{font-family:var(--script);font-size:1.4rem;color:var(--ink-soft);opacity:0;transition:opacity 0.5s ease 0.4s}
.theme-transition.active .theme-transition-text{opacity:1}
.theme-transition-sprig{width:50px;height:70px;opacity:0;transition:opacity 0.5s ease 0.4s;animation:sprigSway 4s ease-in-out infinite}
.theme-transition.active .theme-transition-sprig{opacity:0.7}
.theme-transition-sprig svg{width:100%;height:100%;display:block}
@keyframes sprigSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

.atmosphere{position:fixed;top:0;left:-50vw;width:200vw;height:100vh;pointer-events:none;z-index:3;overflow:hidden;will-change:transform}.atmosphere>*{position:absolute}
.atmosphere-fg{position:fixed;top:0;left:-50vw;width:200vw;height:100vh;pointer-events:none;z-index:15;overflow:hidden;opacity:0.6;will-change:transform}.atmosphere-fg>*{position:absolute}

.scroll-hint-fixed{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:0.5rem;opacity:0;pointer-events:none;transition:opacity 0.6s ease}
.scroll-hint-fixed.show{opacity:0.5}
.scroll-hint-fixed svg{width:22px;height:11px;animation:hintSlide 2.5s ease-in-out infinite}
.scroll-hint-fixed span{font-family:var(--script);font-size:0.9rem;color:var(--ink-soft);white-space:nowrap;text-shadow:0 1px 2px rgba(255,255,255,0.5)}
@keyframes hintSlide{0%,100%{transform:translateX(0)}50%{transform:translateX(15px)}}
@media(max-width:480px){.scroll-hint-fixed span{display:none}.scroll-hint-fixed{bottom:0.5rem}}

/* === MESSAGE MODAL === */
.msg-modal{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.msg-modal.active{pointer-events:all}
.msg-modal-bg{position:absolute;inset:0;background:rgba(42,26,15,0.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity 0.5s ease}
.msg-modal.active .msg-modal-bg{opacity:1}
.msg-modal-panel{position:relative;width:100%;max-width:600px;height:88vh;background:rgba(255,252,245,0.96);border-radius:28px 28px 0 0;box-shadow:0 -10px 50px rgba(0,0,0,0.15);transform:translateY(100%);transition:transform 0.7s cubic-bezier(0.2,0.8,0.2,1);display:flex;flex-direction:column;padding:1.5rem 2rem 1.5rem;z-index:1;overflow:hidden}
.msg-modal.active .msg-modal-panel{transform:translateY(0)}
.modal-grip{width:40px;height:4px;background:var(--gold-line);opacity:0.4;border-radius:2px;margin:0 auto 1.5rem;flex-shrink:0}
.modal-header{text-align:center;margin-bottom:1.5rem;flex-shrink:0}
.modal-body{flex:1;overflow-y:auto;padding-right:0.5rem;padding-bottom:1rem;-webkit-overflow-scrolling:touch}
.modal-body::-webkit-scrollbar{width:3px}.modal-body::-webkit-scrollbar-track{background:transparent}.modal-body::-webkit-scrollbar-thumb{background:rgba(184,152,104,0.3);border-radius:2px}
.modal-footer{margin-top:1.5rem;text-align:center;flex-shrink:0}

.paper-airplane{position:fixed;left:50%;width:80px;height:40px;z-index:55;opacity:0;pointer-events:none;will-change:transform,opacity}
.paper-airplane svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 8px rgba(80,50,20,0.15))}
.paper-airplane.fly-right{animation:flyRight 2.2s cubic-bezier(0.3,0,0.2,1) forwards}
.paper-airplane.fly-left{animation:flyLeft 2.2s cubic-bezier(0.3,0,0.2,1) forwards}
@keyframes flyRight{0%{left:-10vw;top:50vh;transform:rotate(90deg) scale(0.3);opacity:0}10%{opacity:1;transform:rotate(90deg) scale(1.2)}50%{transform:rotate(75deg) scale(1) translateY(-15vh)}85%{opacity:0.6}100%{left:110vw;top:30vh;transform:rotate(85deg) scale(0.3);opacity:0}}
@keyframes flyLeft{0%{left:110vw;top:30vh;transform:rotate(-90deg) scale(0.3);opacity:0}10%{opacity:1;transform:rotate(-90deg) scale(1.2)}50%{transform:rotate(-75deg) scale(1) translateY(-15vh)}85%{opacity:0.6}100%{left:-10vw;top:50vh;transform:rotate(-85deg) scale(0.3);opacity:0}}
.paper-trail-dot{position:fixed;width:8px;height:8px;border-radius:50%;background:rgba(184,152,104,0.6);z-index:54;pointer-events:none;opacity:0;animation:trailFade 3s ease-out forwards}
@keyframes trailFade{0%{opacity:0;transform:scale(0.2)}15%{opacity:0.8;transform:scale(1.5)}100%{opacity:0;transform:scale(0.2)}}

.burst-petal{position:fixed;width:16px;height:16px;border-radius:0 100% 0 100%;z-index:54;pointer-events:none;opacity:0;animation:burstFly 2.5s ease-out forwards}
@keyframes burstFly{0%{opacity:0;transform:scale(0.2) translate(0,0)}10%{opacity:0.9;transform:scale(1.5) translate(0,0)}100%{opacity:0;transform:scale(0.4) translate(var(--bx,80px),var(--by,-80px)) rotate(720deg)}}
.burst-butterfly{position:fixed;width:60px;height:48px;z-index:55;pointer-events:none;opacity:0;animation:burstButterfly 3s ease-out forwards}
.burst-butterfly svg{width:100%;height:100%;display:block}
.burst-butterfly .bf-inner{animation:flap 0.15s ease-in-out infinite alternate;transform-origin:center}
@keyframes burstButterfly{0%{opacity:0;transform:scale(0.2) translate(0,0) rotate(0)}10%{opacity:1;transform:scale(1.5) translate(0,0) rotate(5deg)}100%{opacity:0;transform:scale(0.5) translate(var(--bx,180px),var(--by,-120px)) rotate(30deg)}}
.burst-shooting-star{position:fixed;width:6px;height:6px;background:white;border-radius:50%;box-shadow:0 0 12px white,-30px 0 40px rgba(255,255,255,0.5);z-index:55;pointer-events:none;opacity:0;animation:burstShoot 2.5s ease-out forwards}
@keyframes burstShoot{0%{opacity:0;transform:translate(0,0) scale(0.5)}8%{opacity:1;transform:translate(0,0) scale(1.5)}90%{opacity:0.4}100%{opacity:0;transform:translate(var(--bx,300px),var(--by,150px)) scale(0.3)}}
.burst-dino{position:fixed;bottom:12%;width:160px;height:115px;z-index:55;pointer-events:none;opacity:0;animation:burstDinoWalk 3.5s ease-out forwards}
.burst-dino svg{width:100%;height:100%;display:block}
@keyframes burstDinoWalk{0%{opacity:0;transform:translateX(var(--start,0)) scaleX(var(--sx,1)) scale(0.3)}12%{opacity:0.8;transform:translateX(var(--start,0)) scaleX(var(--sx,1)) scale(1)}85%{opacity:0.5}100%{opacity:0;transform:translateX(var(--end,100vw)) scaleX(var(--sx,1)) scale(0.5)}}
.burst-lantern{position:fixed;width:50px;height:70px;z-index:55;pointer-events:none;opacity:0;animation:burstLantern 3.5s ease-out forwards}
.burst-lantern svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 14px rgba(255,180,80,0.8))}
@keyframes burstLantern{0%{opacity:0;transform:translateY(0) scale(0.3)}12%{opacity:1;transform:translateY(-30px) scale(1.2)}85%{opacity:0.4}100%{opacity:0;transform:translateY(-200px) scale(0.5)}}

.sparkle{border-radius:50%;opacity:0;animation:sparkleTwinkle ease-in-out infinite;will-change:transform,opacity}
@keyframes sparkleTwinkle{0%,100%{opacity:0;transform:scale(0.3)}50%{opacity:0.9;transform:scale(1.3)}}
.default-sun{top:-120px;right:5%;width:460px;height:460px;background:radial-gradient(circle,rgba(251,231,168,0.5) 0%,rgba(240,208,124,0.22) 35%,transparent 70%);filter:blur(8px);animation:pulse 14s ease-in-out infinite}
.default-cloud{will-change:transform}.default-cloud svg{width:100%;height:100%;display:block}
.dc1{top:8%;left:10%;width:300px;height:105px;animation:drift 70s linear infinite}
.dc2{top:22%;left:30%;width:220px;height:75px;animation:drift 90s linear infinite -40s;opacity:0.75;filter:blur(1px)}
.dc3{top:14%;left:50%;width:260px;height:90px;animation:drift 80s linear infinite -70s}
.dc4{top:30%;left:70%;width:180px;height:60px;animation:drift 100s linear infinite -90s;opacity:0.55;filter:blur(1.5px)}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes pulse{0%,100%{opacity:0.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.particle{border-radius:50%;opacity:0;background:radial-gradient(circle,rgba(201,169,121,0.8) 0%,transparent 70%);animation:floatUp linear infinite;will-change:transform,opacity}
@keyframes floatUp{0%{transform:translateY(105vh) translateX(0) scale(0.4);opacity:0}10%{opacity:0.55}50%{transform:translateY(50vh) translateX(25px) scale(1);opacity:0.5}90%{opacity:0.3}100%{transform:translateY(-10vh) translateX(-15px) scale(0.6);opacity:0}}
.butterfly-default{will-change:transform}.butterfly-default svg{width:100%;height:100%;display:block}
.bf-inner{animation:flap 0.28s ease-in-out infinite alternate;transform-origin:center;filter:drop-shadow(0 2px 3px rgba(80,50,20,0.15))}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(0.32)}}
.bd1{width:38px;height:30px;color:#C99A92;animation:bp1 22s linear infinite -2s}
.bd2{width:30px;height:24px;color:#B86E4F;animation:bp2 28s linear infinite -10s}
.bd3{width:44px;height:36px;color:#C9A979;animation:bp3 25s linear infinite -18s}
.bd4{width:28px;height:22px;color:#8A9C7E;animation:bp4 32s linear infinite -6s}
.bd5{width:34px;height:28px;color:#D4877A;animation:bp5 30s linear infinite -22s}
.bd6{width:32px;height:26px;color:#E8B088;animation:bp6 18s linear infinite -4s}
.bd7{width:28px;height:22px;color:#C99A92;animation:bp7 20s linear infinite -12s}
.bd8{width:36px;height:28px;color:#F0C8A0;animation:bp8 16s linear infinite -8s}
@keyframes bp1{0%{transform:translate(-15vw,30vh) rotate(15deg)}25%{transform:translate(25vw,22vh) rotate(-10deg)}50%{transform:translate(50vw,45vh) rotate(20deg)}75%{transform:translate(75vw,28vh) rotate(-15deg)}100%{transform:translate(115vw,35vh) rotate(20deg)}}
@keyframes bp2{0%{transform:translate(110vw,60vh) rotate(-15deg)}33%{transform:translate(70vw,42vh) rotate(15deg)}66%{transform:translate(35vw,55vh) rotate(-20deg)}100%{transform:translate(-15vw,50vh) rotate(-15deg)}}
@keyframes bp3{0%{transform:translate(45vw,-10vh) rotate(20deg)}33%{transform:translate(30vw,25vh) rotate(-10deg)}66%{transform:translate(60vw,50vh) rotate(15deg)}100%{transform:translate(90vw,105vh) rotate(20deg)}}
@keyframes bp4{0%{transform:translate(-10vw,70vh) rotate(10deg)}33%{transform:translate(25vw,55vh) rotate(-20deg)}66%{transform:translate(55vw,70vh) rotate(15deg)}100%{transform:translate(115vw,45vh) rotate(-10deg)}}
@keyframes bp5{0%{transform:translate(85vw,-10vh) rotate(-12deg)}33%{transform:translate(60vw,30vh) rotate(18deg)}66%{transform:translate(30vw,55vh) rotate(-15deg)}100%{transform:translate(-15vw,75vh) rotate(10deg)}}
@keyframes bp6{0%{transform:translate(-15vw,40vh) rotate(15deg)}50%{transform:translate(50vw,30vh) rotate(-10deg)}100%{transform:translate(115vw,45vh) rotate(15deg)}}
@keyframes bp7{0%{transform:translate(115vw,55vh) rotate(-12deg)}50%{transform:translate(50vw,65vh) rotate(10deg)}100%{transform:translate(-15vw,50vh) rotate(-12deg)}}
@keyframes bp8{0%{transform:translate(40vw,-10vh) rotate(20deg)}50%{transform:translate(60vw,40vh) rotate(-10deg)}100%{transform:translate(80vw,105vh) rotate(20deg)}}
.petal-default{border-radius:0 100% 0 100%;opacity:0;will-change:transform,opacity}
@keyframes fallP{0%{transform:translateY(-10vh) translateX(0) rotate(0deg);opacity:0}10%{opacity:0.55}50%{transform:translateY(50vh) translateX(120px) rotate(180deg);opacity:0.5}90%{opacity:0.35}100%{transform:translateY(110vh) translateX(-60px) rotate(540deg);opacity:0}}
@keyframes driftRight{0%{transform:translateX(0) translateY(0) rotate(0);opacity:0}10%{opacity:0.5}50%{transform:translateX(70vw) translateY(20vh) rotate(180deg);opacity:0.45}90%{opacity:0.3}100%{transform:translateX(130vw) translateY(30vh) rotate(540deg);opacity:0}}
@keyframes driftLeft{0%{transform:translateX(0) translateY(0) rotate(0);opacity:0}10%{opacity:0.5}50%{transform:translateX(-70vw) translateY(20vh) rotate(-180deg);opacity:0.45}90%{opacity:0.3}100%{transform:translateX(-130vw) translateY(30vh) rotate(-540deg);opacity:0}}
.soft-glow{top:-100px;right:5%;width:420px;height:420px;filter:blur(10px);animation:pulse 12s ease-in-out infinite}
.pink-cloud{will-change:transform}.pink-cloud svg{width:100%;height:100%;display:block}
.pc1{top:10%;left:10%;width:290px;height:100px;animation:drift 75s linear infinite}
.pc2{top:25%;left:35%;width:210px;height:72px;animation:drift 95s linear infinite -50s;opacity:0.75;filter:blur(1px)}
.pc3{top:16%;left:55%;width:250px;height:85px;animation:drift 85s linear infinite -30s}

.transition-content{max-width:560px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1rem;padding:2rem}
.transition-text{font-family:var(--serif);font-style:italic;font-size:clamp(1.1rem,3.5vw,1.5rem);color:var(--ink-2);line-height:1.5;opacity:0;transform:translateX(20px);transition:opacity 1s ease,transform 1s ease}
.slide.in-view .transition-text{opacity:1;transform:translateX(0)}
.memory-content{max-width:680px;width:100%;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:2rem}
.quote-mark{font-family:var(--serif);font-size:clamp(4rem,12vw,6rem);line-height:0.5;color:var(--gold-line);opacity:0;margin-bottom:0.75rem;font-style:italic;font-weight:500;transition:opacity 1.4s ease}
.slide.in-view .quote-mark{opacity:0.5;animation:breath 6s ease-in-out infinite 1.4s}
@keyframes breath{0%,100%{transform:scale(1);opacity:0.45}50%{transform:scale(1.05);opacity:0.6}}
.memory-eyebrow{font-family:var(--script);font-size:1.3rem;color:var(--accent);letter-spacing:0.01em;margin-bottom:1.25rem;max-width:460px;line-height:1.3;opacity:0;transform:translateX(20px);transition:opacity 1.2s ease 0.3s,transform 1.2s ease 0.3s}
.slide.in-view .memory-eyebrow{opacity:1;transform:translateX(0)}
.memory-text{font-family:var(--serif);font-weight:400;font-size:clamp(1.15rem,3.5vw,1.7rem);line-height:1.45;color:var(--ink);letter-spacing:-0.01em;font-style:italic;max-width:560px;opacity:0;transform:translateX(20px);transition:opacity 1.2s ease 0.6s,transform 1.2s ease 0.6s}
.slide.in-view .memory-text{opacity:1;transform:translateX(0)}
.memory-text em{color:var(--accent);font-style:normal;font-family:var(--script);font-size:1.1em;font-weight:500}
.closing-content{max-width:620px;width:100%;display:flex;flex-direction:column;align-items:center;gap:1.25rem;text-align:center;padding:2rem}
.closing-decoration{width:70px;height:105px;margin-bottom:0.25rem}
.closing-decoration svg{width:100%;height:100%;animation:sway 8s ease-in-out infinite;transform-origin:50% 5%}
.closing-title{font-family:var(--serif);font-weight:400;font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.2;color:var(--ink);letter-spacing:-0.02em;max-width:520px}
.closing-title em{font-style:italic;color:var(--accent);font-weight:500}
.closing-sub{font-family:var(--serif);font-style:italic;font-size:clamp(0.95rem,3vw,1.15rem);color:var(--ink-2);line-height:1.5;max-width:420px;font-weight:400}
.closing-signoff{margin-top:1.25rem;text-align:center}
.signoff-label{font-family:var(--sans);font-size:0.7rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--ink-3);margin-bottom:0.4rem;font-weight:500}
.signoff-names{font-family:var(--script);font-size:1.5rem;color:var(--accent);line-height:1.2}
.closing-divider{width:50px;height:1px;background:var(--gold-line);margin:1rem 0 0.25rem;opacity:0.5}
.closing-actions{margin-top:2rem;display:flex;flex-direction:column;gap:0.85rem;align-items:center}
.btn-soft,.btn-restart{font-family:var(--sans);font-size:0.75rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink);background:rgba(255,255,255,0.5);border:1px solid var(--gold-line);padding:0.8rem 1.8rem;border-radius:999px;cursor:pointer;transition:all 0.4s ease;font-weight:500;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.btn-soft:hover,.btn-restart:hover{background:var(--ink);color:#FBF8F0;border-color:var(--ink);transform:translateY(-2px);box-shadow:0 8px 20px var(--shadow-md)}
.btn-restart{color:var(--ink-2);border-color:rgba(184,152,104,0.5);font-size:0.7rem}
.reveal-target{opacity:0;transform:translateX(30px);transition:opacity 1s cubic-bezier(0.2,0.8,0.2,1),transform 1s cubic-bezier(0.2,0.8,0.2,1)}
.reveal-target.in-view{opacity:1;transform:translateX(0)}
.scroll-progress{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--accent),#F0D07C);z-index:50;transition:width 0.1s ease;width:0;pointer-events:none}
@media(max-width:480px){.code-box{width:38px;height:50px;font-size:1.3rem}.passcode-input{gap:0.4rem}.slide{padding:2.5rem 1rem 4rem}.closing-actions{flex-direction:column}.passcode-content{padding:2rem 1.5rem}.default-sun{width:300px;height:300px}.music-label{display:none}.scroll-hint-fixed span{display:none}.scroll-hint-fixed{bottom:0.5rem}.cursor-glow{display:none}}
@media(max-width:360px){.code-box{width:34px;height:46px;font-size:1.15rem}.passcode-input{gap:0.3rem}}
@media(min-width:768px){.closing-actions{flex-direction:row;justify-content:center}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;animation-iteration-count:1!important}}
</style>
</head>

<script>
const peopleData={
  WAWA01:{theme:'pink',song:'A',name:'Kak Wawa',greeting:'Haloo, Kak Wawa 🫶🏻',intro:'Sebelum kami bertiga officially end our internship era, kami mau ninggalin sedikit kenang-kenangan buat Kak Wawa 🥹🤏🏻',sub:'Nggak seberapa sih, tapi semoga bisa jadi pengingat kalau pernah ada kami bertiga yang numpang belajar, kerja, dan tentunya bikin keributan di sini. Terus karena kayaknya kurang afdol kalau cuma kasih hadiah doang, kami sekalian punya beberapa pesan buat Kak Wawa. So, enjoy the messages yaa, Kak xixixi.',messages:[{from:'Dhimas',text:'Makasii kak, atas segala bimbingan kakak. Jujur awalnya agak sedikit takut sih pas magang disini. Namun seiring dengan berjalan nya waktu tuh ternyata seru banget. Rasanya mau nambah billing magang disini kak. Banyak betul belajar disini kak, belajar main game juga sih yang kadang lebih pusing daripada tugas nya wkwk. Tapi seru banget di Bidang Santis ini kakak juga enjoyy jadinya kami pun lebih terbuka ke kakak juga. Kami nd bisa diganti dengan yang lain kak apalagi kimpul. Lancar terus kak apa yang kakak usahakan dan kakak doakan.'},{from:'Eci',text:'Jujur awalnya aku sempat takut pas tahu Kak Wawa kerja di Diskominfo 😭 Soalnya first impression waktu Kak Wawa jadi juri Statcom dulu tuh agak serem, apalagi waktu itu katanya Kak Wawa sempat marah karena kesalahan kami. Tapi ternyata makin kenal Kak Wawa, makin sadar kalau first impression echi ke kak Wawa dulu tuh salah besar. Kak Wawa ternyata super chill dan seruuuw banget diajak ngobrol, bergibah jugaa si kak hohooo. Dari yang awalnya takut, malah jadi salah satu orang yang bikin aku nyaman selama magang hehee.\n\nMakasih banyak ya, Kak, udah membimbing dan banyak ngajarin kami selama magang. Banyak banget hal yang aku pelajari selama di sini, mulai dari pekerjaan di Diskominfo khususnya di Bidang Santis, sampai hal-hal di luar pekerjaan yang ternyata nggak kalah berkesan. Bahkan sampai dapat ilmu board game juga xixixi\n\nNggak terasa ternyata magangnya udah selesai. Rasanya masih mau lanjut magang hehee. Senang banget bisa kenal sama Kak Wawa dan punya kesempatan buat magang di sini. Terima kasih banyak ya, Kak, untuk semua bantuan, kebaikan, dan ilmunya selama ini. Semoga semua kebaikan kakak dibalas dengan hal-hal baik jugaa.\n\nTerima kasih banyak banyaaak, Kak Wawaaa 🤍'},{from:'Zacky',text:'Makasii banyak yaa Kak Wawa udah ngebimbing kita selama magang di Santis. Awalnya cuma mikir “yaudah magang”, eh ternyata malah dapet banyak ilmu, cerita, sama pengalaman random wkwk. Kerjaan dapet, ilmu dapet, skill main game juga ikut naik walaupun kadang gamenya lebih bikin stres daripada tugas 😭. Kak Wawa juga asik banget diajak ngobrol, jadi nd berasa kalau kita lagi magang. Nggak kerasa udah selesai aja, padahal billing rasanya baru kemarin masuk wkwk. Makasii banyak ya kak buat semuanya, semoga yang kakak usahakan dilancarkan terus. Sukses selalu Kak Wawaa.'}],transition:'Tiga pesan.\nTapi ada satu hal yang sama-sama akan kami ingat...',memory:'Dari yang awalnya cuma mau magang, ternyata pulangnya bawa banyak cerita. And somehow, Kak Wawa jadi salah satu bagian terbaik dari cerita itu. 🤍',closing:"And that's a wrap!",closingSub:'Kayaknya baru kemarin kami datang sebagai anak magang, tahu-tahu sekarang udah waktunya pamit. Makasih banyak buat semua cerita dan keseruannya selama di sini. We had a really good time. 🤍 See you around, kak Wawa 👋🏻',signatures:'Dhimas • Eci • Zacky'},
  DEA02:{theme:'dino',song:'B',name:'Kak Dea',greeting:'Halooo Kak Deaaa! 🤍',intro:'Before we say goodbye to our internship era, kami bertiga mau ninggalin sesuatu buat Kak Dea 🥹🤏🏻',sub:'Nothing much, just a small gift from the three of us. Tapi rasanya kurang lengkap kalau cuma kasih sesuatu tanpa bilang apa-apa, jadi kami sekalian punya beberapa pesan buat Kak Dea. Soo, here comes the messages. xixixi',messages:[{from:'Dhimas',text:'Kak Dea makasii banyak telah membimbing kami dan memberikan ilmu ilmu yang berguna terutama dalam kerja. Dan juga celetukan celetukan kakak yang selalu gong gong bangong, itu juga lucu sih kak. Tapi yang paling nd ekspek ternyata saya dulu tetanggan sama kakak, jujur dunia sempit dan berasap sih. Makasii banyak kak untuk segala hal yang diberikan dari ilmu terutama ilmu game board itu juga apa yaa hehehe. Lancar terus kak urusannya dan segala yang kakak usahakan. Jangan cari pegganti kami di anak magang baru ya kak, bahkan kimpul pun nd bisa mengganti kami.'},{from:'Eci',text:'Kakk, jujuuur, first impression aku lihat Kak Dea tuh kakak kalem dan terlihat seperti pendiem. Ehh ternyata setelah kenal lebih jauh, beda dari bayanganku hehee. Kak Dea malah seru banget, selalu ada aja celetukan random yang bikin suasana jadi rame.\n\nTerus gara-gara Kak Dea juga echi jadi tau sama Pet War. Awalnya cuma main satu game, tapi lama-lama malah jadi makin banyak board game yang bisa dimainkan. Ngga nyangka aja dari satu game bisa jadi sesering itu main bareng selama magang.\n\nMakasih banyak ya kak, udah membimbing dan bikin masa magang echi jadi lebih fun. Banyak hal yang echi pelajari dan pengalaman yang bakal aku inget dari sini. Senang banget bisa kenal sama Kak Dea dan punya kesempatan buat magang di sini. Semoga semua kebaikan kakak dibalas dengan hal-hal baik jugaa.\n\nTerima kasih banyak banyaaak, kak Deaaa 🤍'},{from:'Zacky',text:'Makasii banyak yaa Kak Dea udah ngebimbing kita selama magang. Awalnya kirain kalem, ternyata makin kenal makin banyak celetukan random yang bikin suasana rame wkwk. Gara-gara Kak Dea juga jadi kenal Pet War, Uno kancai, Monopelit, sampe fitnah fintah orng wkwkwk, yang awalnya cuma coba-coba malah jadi langganan main 😭. Makasii banyak buat ilmu, cerita, dan segala randomnya selama ini. Sukses terus Kak Deaaa, jangan cari pengganti kita dulu wkwk!'}],transition:'Tapi ada satu hal kecil yang kayaknya bakal selalu ngingetin kami sama Kak Dea. 👀',memory:'"Jangan Terlalu ini Benar, Kayak same Siape Jak" (pasang lagu kebangsaan kk)',closing:'Thank you for being part of our learning journey.',closingSub:'',signatures:'Dhimas • Eci • Zacky'},
  RENI04:{theme:'lavender',song:'C',name:'Kak Renny',greeting:'Hi, Kak Renny.',intro:'Ada sedikit pesan dari kami bertiga yang ingin kami tinggalkan sebelum akhirnya berpamitan.',sub:'',messages:[{from:'Dhimas',text:'Makasii banyak, kak ren. Jujur awalny mikir kakak agak pendiem sih kak. Tapi ternyata kak juga kalo bercanda bisa gong gitu ya kak. Makasii banyak kak telah melibatkan kami dalam Proker kakak Asistensi kemarin, jujur dari situ belajar banyak banget sih kak seputar hal-hal pemerintahan terkait kebutuhan data. Makasii banyak kak, semoga lancar terus apa yang kakak usahakan dan kakak doa kan hehe.'},{from:'Eci',text:'Kakk Renny terima kasih banyaaak atas bimbingan dan ilmu yang dibagi selama aku magang di sini. Banyak hal baru yang aku dapat dan pelajari selama di sini, yang pastinya jadi pengalaman berharga buat aku. Salah satu yang paling berkesan adalah kesempatan untuk ikut rapat asistensi. Dari situ aku jadi bisa belajar banyak hal dan melihat langsung proses yang sebelumnya belum pernah aku temui. Senang banget bisa mendapat kesempatan untuk belajar dan kenal Kak Renny selama magang. Semoga semua kebaikan kakak dibalas dengan hal-hal baik jugaa.\n\nTerima kasih banyak banyaaak, kak Rennyy🤍'},{from:'Zacky',text:'Makasii banyak Kak Renny selama magang ini! Awalnya keliatan kalem, ternyata kalo udah keluar jokes-nya lumayan juga wkwk. Seru sih bisa kerja bareng kakak, apalagi sempat ikut kegiatan asistensi yang ternyata isinya nggak sesimpel yang dibayangin 😭. Banyak cerita dan pengalaman baru yang didapet selama di sini. Semoga Kak Renny makin lancar terus kerjaannya, dan semoga abis ini kita nd jadi orang asing wkwk. Sukses terus Kak Rennyy!'}],transition:'Masa magang akan selesai.\nTapi orang-orang yang membuatnya berkesan akan tinggal lebih lama dalam ingatan.',memory:'Kak Renny mengingatkan kami bahwa perhatian kecil bisa membuat seseorang merasa sangat dihargai.',closing:'Thank you for making our time here worth remembering.',closingSub:'',signatures:'Dhimas • Eci • Zacky'},
  LYD03:{theme:'cosmos',song:'D',name:'Kak Lidia',greeting:'Hi, Kak Lidia.',intro:'Sebelum perjalanan ini selesai, kami ingin meninggalkan sedikit ucapan untuk Kak Lidia.',sub:'',messages:[{from:'Dhimas',text:'Kak Lyd, makasii banyak kak atas bimbingan nya dan tugas tugas yang kakak berikan. Jujur pas pertama kali ketemu kakak jiwa keibuan kakak terpancar sekalehh. Dan kakak orang nya baik banget dan agak nda enakan dengan kami dan berusha nd memberatkan kami. Makasii banyak kak semoga kakak sekeluarga sehat aamiin dan juga apa yang kakak usahakan dan doakan terkabulkan ya kak.'},{from:'Eci',text:'Terima kasih banyak Kak Lyd. Echi ngerasa Kak Lyd selalu berusaha bikin kami nyaman, bahkan rasanya kakak sering banget nggak enakan kalau ngasih tugas atau minta bantuan ke kami. Selama di sini aku juga banyak banget belajar dari Kak Lyd. Tugas yang dikasih selalu beda-beda, jadi aku bisa coba banyak hal baru dan dapat pengalaman yang sebelumnya belum pernah aku kerjakan.\n\nPokoknya aku bersyukur banget bisa kenal dan dapat banyak pengalaman baru dari Kak Lyd selama magang. Makasih banyak ya, Kak, untuk semua bantuan, ilmu, dan kebaikan Kakak selama ini. Semoga kebaikan Kak Lyd selalu dibalas dengan hal-hal baik juga.\n\nTerima kasih banyak banyaaak, kak Lydiaaaa🤍'},{from:'Zacky',text:'Kak Lydia, terima kasih banyak kak atas semua arahan, bantuan, dan pengalaman yang sudah dibagikan selama saya magang. Banyak hal yang saya pelajari selama di sini. Terima kasih sudah membimbing kami dengan baik selama magang. Mohon maaf juga kalau selama di sini masih banyak kekurangan dari saya. Semoga Kak Lidya dan keluarga selalu sehat dan segala urusannya dilancarkan.'}],transition:'Mungkin suatu hari kami lupa detail pekerjaannya.\nTapi kami tidak akan mudah melupakan orang yang pernah mengajarkan kami sesuatu.',memory:'Kak Lidia membuat kami memahami bahwa pekerjaan yang baik selalu dimulai dari kemauan untuk belajar dan bertanggung jawab.',closing:"Thank you for every lesson we'll carry forward.",closingSub:'',signatures:'Dhimas • Eci • Zacky'},
  BUEVI:{theme:'peach',song:'E',name:'Bu Evy',greeting:'Hi, Bu Evy.',intro:'Sebelum masa magang kami berakhir, ada sedikit hal yang ingin kami sampaikan kepada Ibu.',sub:'',messages:[{from:'Dhimas',text:'Ibuu terima kasih banyak bu, untuk segala halnya. Ibu baik banget dengan kami yang bisa dibilang cuma magang disini dan ibu juga mau membaur dengan kami yang mungkin bagi saya atasan yang lain belum tentu bisa seperti ibu. Maaf juga ibu semisal selama kami magang saya khususnya sering telat dan tidak datang pada pukul 7.15 dan bersikap kurang sopan. Makasii banyak ibu untuk segala nya, semoga ibu beserta keluarga sehat terus dan apa yang ibu doakan dan usahakan dikabulkan aamiin..'},{from:'Eci',text:'Terima kasih banyak bu, sudah sangat baik sama kami selama magang di sini. Saya senang banget bisa kenal dan bertemu dengan Ibu. Ibu selalu membuat kami merasa diterima dan nyaman, sering ngajak ngobrol dan bercanda. Terima kasih juga atas bimbingan dan bantuan Ibu selama kami magang. Setiap kali kami belum memahami sesuatu, Ibu selalu bersedia menjelaskan dan membantu dengan sabar. Kebaikan dan perhatian Ibu jadi salah satu hal yang paling berkesan buat saya. Mohon maaf ya, Bu, kalau selama di sini masih ada kekurangan, termasuk kalau pernah kurang tepat waktu. Terima kasih sudah selalu sabar dan baik sama kami. Semoga kebaikan Ibu selalu dibalas dengan hal-hal baik juga.\n\nTerima kasih banyak banyaaak, bu Evyyyy🤍'},{from:'Zacky',text:'Bu Evy, terima kasih banyak ya, Bu, untuk waktu dan kesempatan yang sudah Ibu berikan selama kami magang. Saya bersyukur bisa mendapat pengalaman berada di lingkungan kerja seperti ini dan melihat langsung bagaimana banyak hal dijalankan sehari-hari. Banyak hal yang mungkin terlihat sederhana selama di sini, tapi justru jadi pengalaman baru dan pelajaran buat saya. Mohon maaf juga kalau selama magang masih ada sikap atau perilaku saya yang kurang berkenan. Semoga Ibu dan keluarga selalu diberikan kesehatan, kelancaran dalam setiap urusan, dan segala yang Ibu usahakan bisa berjalan dengan baik.'}],transition:'Bagi seseorang mungkin ini hanya sebuah kesempatan.\nBagi kami, kesempatan itu menjadi awal dari banyak pengalaman dan pembelajaran.',memory:'Kesempatan yang Ibu berikan telah menjadi salah satu bagian penting dalam proses kami mempersiapkan diri untuk perjalanan berikutnya.',closing:'Thank you for giving us the opportunity to learn, grow, and experience.',closingSub:'',signatures:'Dhimas • Eci • Zacky'},
  KAKMEL:{theme:'mint',song:'F',name:'Kak Mel',greeting:'Hi, Kak Mel.',intro:'Kami menyiapkan sedikit pesan untuk mengucapkan terima kasih atas semua yang sudah menjadi bagian dari perjalanan kami.',sub:'',messages:[{from:'Dhimas',text:'Makasii banyak kak mel sudah mau menerima kami menjadi bagian di Statistik dan maaf juga apabila kami kadang ribut dan lumayan sering terlambat. Terima kasih atas kesempatan yang diberikan kepada kami.'},{from:'Eci',text:'Terima kasih banyak, Kak Mel, atas kebaikan, bimbingan dan bantuan selama aku menjalani masa magang di sini. Senang bisa mendapat kesempatan untuk belajar dan mendapatkan banyak pengalaman baru selama di sini. Aku juga mau minta maaf ya, Kak, kalau selama magang ada perkataan atau sikapku yang kurang berkenan. Semoga Kak Mel selalu diberikan kelancaran dalam pekerjaan dan kebaikan kakak selalu dibalas dengan hal-hal baik juga.\n\nTerima kasih banyak banyaaak, Kak Melisaa 🤍'},{from:'Zacky',text:'Kak Mel, terima kasih banyak ya, Kak, sudah menjadi bagian dari pengalaman magang kami. Senang bisa mendapat kesempatan untuk berada di sini dan mengenal orang-orang baru selama menjalani magang. Kalau selama di sini saya ada salah dalam perkataan atau sikap, saya juga mau minta maaf ya, Kak. Semoga Kak Mel dan keluarga selalu sehat, dimudahkan dalam pekerjaan, dan selalu diberikan hal-hal baik ke depannya.'}],transition:'Magang memberikan kami pengalaman.\nTapi orang-orang di dalamnya yang membuat pengalaman itu mempunyai cerita.',memory:'Kak Mel menjadi salah satu orang yang membuat proses belajar kami terasa lebih ringan dan menyenangkan.',closing:'Thank you for being one of the good parts of our story here.',closingSub:'',signatures:'Dhimas • Eci • Zacky'},
  PAKJEC:{theme:'lantern',song:'G',name:'Pak Jacson',greeting:'Halo, Pak Jacson.',intro:'Sebelum masa magang kami berakhir, ada sedikit hal yang ingin kami sampaikan kepada Pak Jacson.',sub:'',messages:[{from:'Dhimas, Eci & Zacky',text:'Terima kasih, Pak Jacson, karena telah menjadi bagian dari perjalanan magang kami. Setiap interaksi, pengalaman, dan hal-hal yang kami lihat selama berada di lingkungan ini menjadi bagian dari proses belajar yang sangat berarti bagi kami.\n\nKami datang dengan banyak hal yang masih perlu dipelajari dan pulang dengan pengalaman serta pemahaman yang jauh lebih banyak. Terima kasih atas penerimaan dan kesempatan yang diberikan selama kami berada di sini.'}],transition:'Kami datang untuk belajar.\nKami pulang membawa pengalaman, pelajaran, dan banyak cerita.',memory:'Pada akhirnya, yang paling kami ingat bukan hanya apa yang pernah kami kerjakan, tetapi juga orang-orang yang menjadi bagian dari perjalanan itu.',closing:'Thank you for being part of our internship story.',closingSub:'',signatures:'Dhimas • Eci • Zacky'},
  ST07:{theme:'lantern',song:'H',name:'Bidang Statistik & Persandian',greeting:'Hi,',intro:'Sebelum kami selesai menjalani masa magang, ada sedikit ucapan yang ingin kami sampaikan untuk Bidang Statistik & Persandian.',sub:'',messages:[{from:'Dhimas, Eci & Zacky',text:'Terima kasih sudah menjadi bagian dari perjalanan magang kami. Mungkin selama berada di sini tidak setiap saat kami memiliki kesempatan untuk banyak berbicara atau bekerja bersama, tetapi setiap interaksi, bantuan, obrolan, dan pengalaman yang kami dapatkan tetap menjadi bagian dari cerita kami.\n\nBagi kami, magang ini bukan hanya tentang menyelesaikan pekerjaan. Kami juga belajar beradaptasi, berkomunikasi, bekerja bersama orang lain, dan mengenal lingkungan kerja yang sebenarnya.\n\nTerima kasih sudah menerima keberadaan kami dengan baik dan ikut membuat perjalanan ini mempunyai banyak cerita untuk dikenang.'}],transition:'Kami datang untuk belajar.\nKami pulang membawa pengalaman, pelajaran, dan banyak cerita.',memory:'Pada akhirnya, yang paling kami ingat bukan hanya apa yang pernah kami kerjakan, tetapi juga orang-orang yang menjadi bagian dari perjalanan itu.',closing:'Thank you for being part of our internship story.',closingSub:'',signatures:'Dhimas • Eci • Zacky'}
};

    paperAirplane.classList.remove('fly-right','fly-left');void paperAirplane.offsetWidth;

  mc.appendChild(s1);
  
  const s2=document.createElement('section');s2.className='slide';
  s2.innerHTML=`<div class="transition-content"><div class="botanical-sprig" style="width:50px;height:70px">${sprigSVG}</div><p class="transition-text">${person.transition.replace(/\n/g,'<br>')}</p></div>`;
  mc.appendChild(s2);
  
  const s3=document.createElement('section');s3.className='slide';
  s3.innerHTML=`<div class="memory-content"><div class="quote-mark">"</div><p class="memory-eyebrow">One thing we'll always remember.</p><p class="memory-text">${person.memory}</p><div style="width:50px;height:75px;margin-top:2rem">${sprigSVG}</div></div>`;
  mc.appendChild(s3);
  
  const s4=document.createElement('section');s4.className='slide';
  s4.innerHTML=`<div class="closing-content"><div class="closing-decoration">${sprigSVG}</div><h2 class="closing-title">${person.closing}</h2>${person.closingSub?`<p class="closing-sub">${person.closingSub}</p>`:''}<div class="closing-signoff"><p class="signoff-label">Dari,</p><p class="signoff-names">${person.signatures}</p></div><div class="closing-divider"></div><div class="closing-actions"><button class="btn-soft" id="btnReread">Baca lagi</button><button class="btn-restart" id="btnRestart">Buka untuk orang lain</button></div></div>`;
  mc.appendChild(s4);
  
  s1.querySelector('#btnOpen').addEventListener('click',()=>{
    msgModal.classList.add('active');
    document.querySelectorAll('.msg-note').forEach(c=>cardObserver.observe(c));
  });

  btnCloseMsg.onclick = () => {
    msgModal.classList.remove('active');
    const btn=s1.querySelector('#btnOpen');
    const rect=btn.getBoundingClientRect();
    const plane=document.createElement('div');
    plane.className='paper-airplane';plane.innerHTML=paperAirplaneSVG;
    plane.style.left=rect.left+'px';plane.style.top=rect.top+'px';plane.style.opacity='1';
    plane.style.transition='all 1.5s cubic-bezier(0.3,0,0.2,1)';
    document.body.appendChild(plane);
    requestAnimationFrame(()=>{plane.style.left='110%';plane.style.top='25%';plane.style.transform='rotate(20deg) scale(0.5)';plane.style.opacity='0'});
    for(let i=0;i<20;i++){setTimeout(()=>{const dot=document.createElement('div');dot.className='paper-trail-dot';dot.style.left=rect.left+'px';dot.style.top=rect.top+'px';document.body.appendChild(dot);setTimeout(()=>dot.remove(),3000)},i*50)}
    setTimeout(()=>plane.remove(),1500);
    setTimeout(()=>triggerThemeTransition(person.theme,'right'),200);
    setTimeout(()=>s2.scrollIntoView({behavior:'smooth',block:'start',inline:'start'}),800);
  };

  s4.querySelector('#btnReread').addEventListener('click',()=>{s1.scrollIntoView({behavior:'smooth',block:'start',inline:'start'})});
  s4.querySelector('#btnRestart').addEventListener('click',()=>restart());
  document.querySelectorAll('.slide').forEach(s=>slideObserver.observe(s));
  document.querySelectorAll('.reveal-target').forEach(el=>revealObserver.observe(el));
  updateSlide3D(0);
}

const slideObserver=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in-view')}})},{threshold:0.25,root:document.getElementById('main-content')});
const revealObserver=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in-view');revealObserver.unobserve(e.target)}})},{threshold:0.15,root:document.getElementById('main-content')});
const cardObserver=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('reveal');cardObserver.unobserve(e.target)}})},{threshold:0.1});

let rafPending=false;
function updateSlide3D(scrollX){
  const sw=window.innerWidth;
  const slides=document.querySelectorAll('#main-content .slide');
  const cur=Math.round(scrollX/sw);
  slides.forEach((s,i)=>{
    const dist=Math.abs(i-cur);
    if(dist>1.2){s.style.opacity='0';s.style.transform=`perspective(1400px) scale(0.8) rotateY(${i>cur?28:-28}deg) translateZ(-40px)`;s.style.filter='blur(5px)';return}
    const off=(i*sw-scrollX)/sw;const ao=Math.abs(off);
    s.style.opacity=Math.max(0,1-ao*0.7);
    s.style.transform=`perspective(1400px) scale(${1-ao*0.1}) rotateY(${off*25}deg) translateZ(${-ao*35}px)`;
    s.style.filter=`blur(${ao*3}px)`;
  });
}

let lastScrollX=0,lastSlideIndex=0,lastAirplaneTime=0;
const mc=document.getElementById('main-content');
mc.addEventListener('scroll',()=>{
  const scrollX=mc.scrollLeft;
  if(!rafPending){rafPending=true;requestAnimationFrame(()=>{rafPending=false;updateSlide3D(scrollX)})}
  const direction=scrollX>lastScrollX?'right':'left';
  const slideWidth=window.innerWidth;
  const currentIdx=Math.round(scrollX/slideWidth);
  if(currentIdx!==lastSlideIndex&&lastSlideIndex>=0){
    const now=Date.now();
    if(now-lastAirplaneTime>800){
      lastAirplaneTime=now;
      const theme=document.body.dataset.theme;
      triggerThemeTransition(theme,direction);
    }
  }
  lastSlideIndex=currentIdx;lastScrollX=scrollX;
  const atm=document.getElementById('atmosphere');const fg=document.getElementById('atmosphereFg');
  atm.style.transform=`translateX(${-scrollX*0.06}px)`;
  fg.style.transform=`translateX(${-scrollX*0.1}px)`;
  const maxScroll=mc.scrollWidth-window.innerWidth;const pct=maxScroll>0?(scrollX/maxScroll)*100:0;
  document.getElementById('scrollProgress').style.width=`${Math.min(100,pct)}%`;
},{passive:true});

let currentPerson=null,isOpening=false;
const codeBoxes=Array.from(document.querySelectorAll('.code-box')),passcodeInput=document.getElementById('passcode-input'),passcodeError=document.getElementById('passcode-error'),screenPasscode=document.getElementById('screen-passcode'),mainContent=document.getElementById('main-content'),themeTransition=document.getElementById('themeTransition');
codeBoxes.forEach((box,idx)=>{box.addEventListener('input',e=>{let val=e.target.value;if(val.length>1){val=val[val.length-1];e.target.value=val}e.target.value=e.target.value.toUpperCase();if(e.target.value&&idx<codeBoxes.length-1)codeBoxes[idx+1].focus();box.classList.toggle('filled',e.target.value.length>0);checkCode()});box.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!e.target.value&&idx>0){e.preventDefault();const p=codeBoxes[idx-1];p.value='';p.classList.remove('filled');p.focus()}if(e.key==='ArrowLeft'&&idx>0)codeBoxes[idx-1].focus();if(e.key==='ArrowRight'&&idx<codeBoxes.length-1)codeBoxes[idx+1].focus()});box.addEventListener('paste',e=>{e.preventDefault();const pasted=(e.clipboardData||window.clipboardData).getData('text').toUpperCase().replace(/[^A-Z0-9]/g,'');pasted.split('').forEach((char,i)=>{if(i<codeBoxes.length){codeBoxes[i].value=char;codeBoxes[i].classList.add('filled')}});if(pasted.length<codeBoxes.length)codeBoxes[pasted.length].focus();else codeBoxes[codeBoxes.length-1].focus();checkCode()})});
function checkCode(){const code=codeBoxes.map(b=>b.value).join('');if(code.length===0){hideError();return}if(peopleData[code]){currentPerson=peopleData[code];revealMainContent();return}const isPrefix=Object.keys(peopleData).some(pc=>pc.startsWith(code));if(!isPrefix&&code.length>=2)showError();else hideError()}
function showError(){passcodeError.textContent='Hmm... sepertinya ada yang belum tepat. Coba lagi ya 🤍';passcodeError.classList.add('show');passcodeInput.classList.add('shake');setTimeout(()=>passcodeInput.classList.remove('shake'),500)}
function hideError(){passcodeError.classList.remove('show');setTimeout(()=>{if(!passcodeError.classList.contains('show'))passcodeError.textContent=''},400)}
function revealMainContent(){if(isOpening)return;isOpening=true;screenPasscode.style.transition='opacity 0.7s ease, transform 0.7s ease, filter 0.7s ease';screenPasscode.style.opacity='0';screenPasscode.style.transform='scale(0.96)';screenPasscode.style.filter='blur(8px)';themeTransition.classList.add('active');setTimeout(()=>{screenPasscode.style.display='none';applyTheme(currentPerson.theme);if(currentPerson.song&&currentPerson.song!==currentSongKey)switchSong(currentPerson.song);buildSlides(currentPerson);mainContent.classList.remove('hidden');requestFullscreen();setTimeout(()=>{themeTransition.classList.remove('active');setTimeout(()=>{mainContent.classList.add('visible');const firstSlide=mainContent.querySelector('.slide');if(firstSlide)firstSlide.classList.add('in-view');lastSlideIndex=0;scrollHintFixed.classList.add('show');updateSlide3D(0);},300);mc.scrollLeft=0;setTimeout(()=>{isOpening=false},1800)},450)},900)}
function restart(){msgModal.classList.remove('active');mainContent.style.opacity='0';scrollHintFixed.classList.remove('show');themeTransition.classList.add('active');setTimeout(()=>{codeBoxes.forEach(b=>{b.value='';b.classList.remove('filled')});mainContent.classList.add('hidden');mainContent.classList.remove('visible');mainContent.innerHTML='';modalBody.innerHTML='';mainContent.style.opacity='';applyTheme('default');if(currentSongKey!=='A')switchSong('A');screenPasscode.style.display='flex';screenPasscode.style.opacity='1';screenPasscode.style.transform='scale(1)';screenPasscode.style.filter='blur(0)';mc.scrollLeft=0;window.scrollTo(0,0);setTimeout(()=>{themeTransition.classList.remove('active');setTimeout(()=>codeBoxes[0].focus(),600)},400);currentPerson=null},1000)}

applyTheme('default');setTimeout(()=>{codeBoxes[0].focus()},1800);
window.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement&&document.activeElement.classList.contains('code-box')){e.preventDefault();checkCode()}});
</script>
</body>
</html>
